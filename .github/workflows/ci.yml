name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check
      - run: npm test
      - run: docker build -t trace:test .
      - name: Container smoke test
        run: |
          docker run -d --name trace-test -p 3000:3000 -e TRACE_PASSWORD=ci-test-password-123 trace:test
          for i in $(seq 1 20); do
            if curl --fail http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs trace-test
          exit 1
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
